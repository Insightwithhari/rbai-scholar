name: Publish to the MCP Registry

# Lists server.json at registry.modelcontextprotocol.io as io.github.Insightwithhari/rbai-scholar.
# A listing cannot be deleted or edited once published (only a new version can follow), so check the name,
# the description and the links in server.json before running this. Versions 1.0.0 to 1.0.3 were published without
# a repository link; the next version can add one.
# Runs only when started by hand (Actions → Publish to the MCP Registry → Run workflow) or when a v* tag is
# pushed. GitHub OIDC proves this repository belongs to Insightwithhari; no secret is stored.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Check the benchmark first
        run: node benchmark/score.mjs
      - name: Install mcp-publisher v1.8.1 (checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
